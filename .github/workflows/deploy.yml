name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 2. Deploy via FTP ────────────────────────────────────────────────────
  deploy:
    name: Deploy to hosting
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -e "
            set ftp:ssl-allow no;
            set net:timeout 60;
            set net:max-retries 3;
            mirror --reverse --delete --parallel=4 dist/ /;
            bye
          " ftp://$FTP_USER:$FTP_PASS@$FTP_HOST

  # ── 3. GitHub Release with ZIP (only on version tags) ────────────────────
  release:
    name: Create release archive
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../public_html.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: public_html.zip
          generate_release_notes: true
          body: |
            ## Сборка сайта msvproekt.ru

            Распакуйте `public_html.zip` в папку `public_html` на хостинге для ручного деплоя.
