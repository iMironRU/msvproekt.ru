name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Build ──────────────────────────────────────────────────────────────
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── 2. Deploy via rsync over SSH ──────────────────────────────────────────
  deploy:
    name: Deploy to hosting
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT" \
            dist/ \
            "$SSH_USER@$SSH_HOST:$SSH_PATH/"
          rm -f ~/.ssh/id_rsa

  # ── 3. GitHub Release with ZIP (only on version tags) ────────────────────
  release:
    name: Create release archive
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create ZIP
        run: |
          cd dist
          zip -r ../public_html.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: public_html.zip
          generate_release_notes: true
          body: |
            ## Сборка сайта msvproekt.ru

            Распакуйте `public_html.zip` в папку `public_html` на хостинге для ручного деплоя.
